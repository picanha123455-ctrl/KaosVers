name: Compilar KaosVerse APK e EXE

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build.yml'
      - 'KaosVerse_V21_Compilacao_APK_EXE_Celular.zip'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  compilar:
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Baixar arquivos
        uses: actions/checkout@v4

      - name: Extrair KaosVerse
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p temp/kit temp/projeto

          unzip -q KaosVerse_V21_Compilacao_APK_EXE_Celular.zip -d temp/kit

          unzip -q temp/kit/KaosVerse_V21_Studio_Explorer_Toolbox.zip -d temp/projeto

          test -f temp/projeto/KaosVerse_V21/project.godot

          python3 - <<'PY'
          from pathlib import Path
          p = Path('temp/projeto/KaosVerse_V21/export_presets.cfg')
          s = p.read_text(encoding='utf-8')
          if 'binary_format/embed_pck=' not in s:
              s = s.replace(
                  '[preset.0.options]\n',
                  '[preset.0.options]\nbinary_format/embed_pck=true\n',
                  1
              )
          p.write_text(s, encoding='utf-8')
          PY

      - name: Instalar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Android
        uses: android-actions/setup-android@v3

      - name: Instalar SDK e criar assinatura de teste
        shell: bash
        run: |
          set -euo pipefail

          sdkmanager --install 'platform-tools' 'platforms;android-36' 'build-tools;36.0.0'

          mkdir -p "$HOME/.android" "$HOME/.config/godot"

          keytool -genkeypair \
            -keystore "$HOME/.android/debug.keystore" \
            -alias androiddebugkey \
            -storepass android \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname 'CN=KaosVerse Debug,O=KaosVerse,C=BR' \
            -noprompt

          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PATH=$HOME/.android/debug.keystore" >> "$GITHUB_ENV"
          echo 'GODOT_ANDROID_KEYSTORE_DEBUG_USER=androiddebugkey' >> "$GITHUB_ENV"
          echo 'GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD=android' >> "$GITHUB_ENV"

          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-$HOME/android-sdk}}"

          cat > "$HOME/.config/godot/editor_settings-4.7.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]
          [resource]
          export/android/android_sdk_path = "$SDK"
          export/android/java_sdk_path = "$JAVA_HOME"
          EOF

      - name: Instalar Godot
        shell: bash
        run: |
          set -euo pipefail

          VERSION=4.7.2
          BASE="https://github.com/godotengine/godot-builds/releases/download/${VERSION}-stable"

          curl -fL --retry 3 \
            "$BASE/Godot_v${VERSION}-stable_linux.x86_64.zip" \
            -o /tmp/godot.zip

          unzip -q /tmp/godot.zip -d /tmp

          sudo install -m 755 \
            "/tmp/Godot_v${VERSION}-stable_linux.x86_64" \
            /usr/local/bin/godot

          curl -fL --retry 3 \
            "$BASE/Godot_v${VERSION}-stable_export_templates.tpz" \
            -o /tmp/templates.tpz

          unzip -q /tmp/templates.tpz -d /tmp

          mkdir -p "$HOME/.local/share/godot/export_templates/${VERSION}.stable"

          cp -a /tmp/templates/. \
            "$HOME/.local/share/godot/export_templates/${VERSION}.stable/"

          godot --version

      - name: Importar arquivos do jogo
        shell: bash
        run: |
          godot --headless \
            --path temp/projeto/KaosVerse_V21 \
            --editor --import --quit

      - name: Criar APK e EXE
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p build

          godot --headless \
            --path temp/projeto/KaosVerse_V21 \
            --export-release 'Windows Desktop' \
            "$GITHUB_WORKSPACE/build/KaosVerse.exe"

          godot --headless \
            --path temp/projeto/KaosVerse_V21 \
            --export-debug 'Android' \
            "$GITHUB_WORKSPACE/build/KaosVerse.apk"

          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile

          apk = Path('build/KaosVerse.apk')
          exe = Path('build/KaosVerse.exe')

          assert apk.exists() and apk.stat().st_size > 1000000
          assert exe.exists() and exe.stat().st_size > 1000000

          assert apk.read_bytes()[:2] == b'PK'
          assert exe.read_bytes()[:2] == b'MZ'

          with ZipFile(apk) as z:
              assert 'AndroidManifest.xml' in z.namelist()

          print('Arquivos APK e EXE gerados.')
          PY

      - name: Disponibilizar instaladores
        uses: actions/upload-artifact@v4
        with:
          name: KaosVerse-APK-EXE
          path: |
            build/KaosVerse.apk
            build/KaosVerse.exe
          if-no-files-found: error

      - name: Publicar no GitHub Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail

          TAG='v0.21-preview'

          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" \
              --title 'KaosVerse V21 - Teste' \
              --notes 'Versão experimental para Android e Windows.' \
              --prerelease \
              --target "$GITHUB_SHA"
          fi

          gh release upload "$TAG" \
            build/KaosVerse.apk \
            build/KaosVerse.exe \
            --clobber
            
