
name: KaosVerse - APK e EXE

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/blank.yml'
      - 'KaosVerse_V21_Compilacao_APK_EXE_Celular.zip'
      - 'KaosVerse_V21_Studio_Explorer_Toolbox.zip'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  compilar:
    name: Gerar ${{ matrix.platform }}
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    strategy:
      fail-fast: false
      matrix:
        platform: [windows, android]

    steps:
      - name: Baixar arquivos
        uses: actions/checkout@v4

      - name: Extrair KaosVerse
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p projeto kit
          if [ -f KaosVerse_V21_Compilacao_APK_EXE_Celular.zip ]; then
            unzip -q KaosVerse_V21_Compilacao_APK_EXE_Celular.zip -d kit
            unzip -q kit/KaosVerse_V21_Studio_Explorer_Toolbox.zip -d projeto
          elif [ -f KaosVerse_V21_Studio_Explorer_Toolbox.zip ]; then
            unzip -q KaosVerse_V21_Studio_Explorer_Toolbox.zip -d projeto
          else
            echo 'ZIP do projeto nao encontrado'
            exit 1
          fi
          test -f projeto/KaosVerse_V21/project.godot
          python3 - <<'PY'
          from pathlib import Path
          p = Path('projeto/KaosVerse_V21/export_presets.cfg')
          s = p.read_text(encoding='utf-8')
          if 'binary_format/embed_pck=true' not in s:
              s = s.replace(
                  '[preset.0.options]',
                  '[preset.0.options]\nbinary_format/embed_pck=true',
                  1
              )
          p.write_text(s, encoding='utf-8')
          PY

      - name: Instalar Godot 4.7.2
        shell: bash
        run: |
          set -euo pipefail
          BASE=https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable

          curl -fL --retry 4 \
            "$BASE/Godot_v4.7.2-stable_linux.x86_64.zip" \
            -o /tmp/godot.zip

          unzip -q /tmp/godot.zip -d /tmp

          sudo install -m 755 \
            /tmp/Godot_v4.7.2-stable_linux.x86_64 \
            /usr/local/bin/godot

          curl -fL --retry 4 \
            "$BASE/Godot_v4.7.2-stable_export_templates.tpz" \
            -o /tmp/templates.tpz

          mkdir -p /tmp/godot-templates
          unzip -q /tmp/templates.tpz -d /tmp/godot-templates

          mkdir -p "$HOME/.local/share/godot/export_templates/4.7.2.stable"

          cp -a /tmp/godot-templates/templates/. \
            "$HOME/.local/share/godot/export_templates/4.7.2.stable/"

          godot --version

      - name: Instalar Java
        if: matrix.platform == 'android'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Android SDK
        if: matrix.platform == 'android'
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Preparar assinatura Android
        if: matrix.platform == 'android'
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager --install 'build-tools;35.0.1' 'platforms;android-35'

          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"

          test -d "$SDK/build-tools"

          mkdir -p "$HOME/.config/godot" "$HOME/.android"

          cat > "$HOME/.config/godot/editor_settings-4.7.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]
          [resource]
          export/android/android_sdk_path = "$SDK"
          export/android/java_sdk_path = "$JAVA_HOME"
          EOF

          keytool -genkeypair -noprompt \
            -keystore "$HOME/.android/kaosverse-debug.keystore" \
            -alias kaosverse \
            -storepass android \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname 'CN=KaosVerse Teste,O=KaosVerse,C=BR'

          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PATH=$HOME/.android/kaosverse-debug.keystore" >> "$GITHUB_ENV"
          echo 'GODOT_ANDROID_KEYSTORE_DEBUG_USER=kaosverse' >> "$GITHUB_ENV"
          echo 'GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD=android' >> "$GITHUB_ENV"

      - name: Importar recursos
        shell: bash
        run: |
          godot --headless \
            --path projeto/KaosVerse_V21 \
            --editor --import --quit

      - name: Criar EXE
        if: matrix.platform == 'windows'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build
          godot --headless \
            --path projeto/KaosVerse_V21 \
            --export-release 'Windows Desktop' \
            "$GITHUB_WORKSPACE/build/KaosVerse.exe"
          test -s build/KaosVerse.exe
          python3 -c "assert open('build/KaosVerse.exe','rb').read(2) == b'MZ'"

      - name: Criar APK
        if: matrix.platform == 'android'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build
          godot --headless \
            --path projeto/KaosVerse_V21 \
            --export-debug 'Android' \
            "$GITHUB_WORKSPACE/build/KaosVerse.apk"
          test -s build/KaosVerse.apk
          python3 - <<'PY'
          from zipfile import ZipFile
          with ZipFile('build/KaosVerse.apk') as z:
              assert 'AndroidManifest.xml' in z.namelist()
          PY

      - name: Salvar instalador
        uses: actions/upload-artifact@v4
        with:
          name: KaosVerse-${{ matrix.platform }}
          path: build/KaosVerse.*
          if-no-files-found: error

  publicar:
    name: Publicar APK e EXE
    needs: compilar
    runs-on: ubuntu-24.04

    steps:
      - name: Baixar instaladores
        uses: actions/download-artifact@v4
        with:
          pattern: KaosVerse-*
          path: dist
          merge-multiple: true

      - name: Verificar arquivos
        shell: bash
        run: |
          test -s dist/KaosVerse.apk
          test -s dist/KaosVerse.exe
          ls -lh dist/

      - name: Publicar downloads
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          TAG=v0.21-teste

          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" \
              --title 'KaosVerse V21 - Teste' \
              --notes 'APK e EXE experimentais.' \
              --prerelease \
              --target "$GITHUB_SHA"
          fi

          gh release upload "$TAG" \
            dist/KaosVerse.apk \
            dist/KaosVerse.exe \
            --clobber
            
